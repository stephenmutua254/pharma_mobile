<ion-header class="ion-no-border" mode="md">
  <ion-toolbar class="small-toolbar">
    <ion-title color="success">
      Pay - Ksh {{totalCartAmount | number : '.2'}}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button [disabled]="showLoader" color="danger" (click)="close()">
        <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    
  </ion-toolbar>
</ion-header>

<ion-content mode="md">

  <form autocomplete="off"
        #newForm="ngForm"
        (ngSubmit)="savePayment(newForm)"
        *ngIf="!showNotification">
    <ion-grid>

      <ion-row>
        <ion-col size="12">
          <ion-list mode="md">
            <ion-item-sliding #slidingItem 
                  [disabled]="showLoader">
              <ion-item role="article"
                        detail="true"
                        (click)="slidingItem.open('end')">
                <ion-label>
                  <ion-text class="truncate">
                    Payment method
                  </ion-text>
                </ion-label>
                <ion-label slot="end">
                  <ion-text color="success">
                    {{payMethod}}
                  </ion-text>
                </ion-label>
              </ion-item>

              <ion-item-options side="end">
                <ion-item-option color="warning" (click)="payMethod='Cash'; slidingItem.close()">
                  <ion-text>Cash</ion-text>
                </ion-item-option>
                <ion-item-option color="success" (click)="payMethod='M-pesa'; slidingItem.close()">
                  <ion-text>M-pesa</ion-text>
                </ion-item-option>
                <ion-item-option color="secondary" (click)="payMethod='Bank'; slidingItem.close()">
                  <ion-text>Bank</ion-text>
                </ion-item-option>
                <ion-item-option color="danger" (click)="payMethod='Multiple'; slidingItem.close()">
                  <ion-text>Multiple</ion-text>
                </ion-item-option>
              </ion-item-options>

            </ion-item-sliding>
            <br>
            <ion-item [button]="true"
                      [detail]="false"
                      [disabled]="showLoader">
              <ion-label>Payment date</ion-label>
              <ion-datetime-button datetime="datetime"></ion-datetime-button>
            </ion-item>
            <br>
          </ion-list>
        </ion-col>
      </ion-row>


      <ion-row *ngIf="payMethod=='Multiple'">
        <ion-col>
          <ion-list mode="md" >

            <ion-item>
              <ion-input
                  label="Cash amount"
                  type="number"
                  placeholder="Enter number..."
                  label-placement="floating"
                  ngModel
                  name="cash"
                  min="0"
                  [disabled]="showLoader"
                  required>
              </ion-input>
            </ion-item>
            <br>

            <ion-item>
              <ion-input
                  label="M-pesa amount"
                  type="number"
                  placeholder="Enter number..."
                  label-placement="floating"
                  ngModel
                  name="mpesa"
                  min="0"
                  [disabled]="showLoader"
                  required>
              </ion-input>
            </ion-item>
            <br>

            <ion-item>
              <ion-input
                  label="Bank amount"
                  type="number"
                  placeholder="Enter number..."
                  label-placement="floating"
                  ngModel
                  name="bank"
                  min="0"
                  [disabled]="showLoader"
                  required>
              </ion-input>
            </ion-item>
            <br>

            <ion-item>
              <ion-input
                  label="Reference"
                  type="text"
                  placeholder="Enter reference..."
                  label-placement="floating"
                  ngModel
                  [disabled]="showLoader"
                  name="reference">
              </ion-input>
            </ion-item>
            <br>
          </ion-list>
        </ion-col>
      </ion-row>

      <ion-row class="ion-padding-bottom">
        <ion-col [style]="showLoader ? 'display: flex; justify-content: center;' : ''">
          <div class="loader ion-padding-top" *ngIf="showLoader"></div>
          <ion-button expand="block"
                      type="submit"
                      color="success"
                      *ngIf="!showLoader"
                      [disabled]="!confirmPaymentTotal(newForm)"
                      >Complete sale</ion-button>
        </ion-col>
      </ion-row>

    </ion-grid>
  </form>

  <ion-modal #invoiceDateModal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="datetime"
                    presentation="date"
                    [value]="paymentDate.value"
                    [max]="paymentDate.max"
                    #datetime1>
        <ion-buttons slot="buttons">
          <ion-button slot="start" color="danger" (click)="datetime1.cancel(); invoiceDateModal.dismiss()">Cancel</ion-button>
          <ion-button slot="end" color="primary" (click)="datetime1.confirm(); invoiceDateModal.dismiss()">Done</ion-button>
        </ion-buttons>
      </ion-datetime>
    </ng-template>
  </ion-modal>

  <app-notification *ngIf="showNotification" [message]="'Payment completed!'" [showNotification]="showNotification"></app-notification>

</ion-content>
