<ion-header class="ion-no-border" mode="md">
  <ion-toolbar>
    <ion-title>Select unit to sell</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear"
                color="danger"
                (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content mode="md">
  <form autocomplete="off"
      #batchForm="ngForm"
      *ngIf="!showNotification"
      (ngSubmit)="saveItemBatch()">
    <ion-grid>
      <ion-row>
        <ion-col>
          <ion-list>

            <ion-row>
              <ion-col size="6">
                <ion-item>
                  <ion-checkbox
                    (ionChange)="unit='Fullpack'; unitSelected('Fullpack')"
                    [checked]="unit==='Fullpack' ? true : false"
                    justify="start">Fullpack</ion-checkbox>
                </ion-item>
              </ion-col>

              <ion-col size="6">
                <ion-item>
                  <ion-checkbox
                    (ionChange)="unit='Piece'; unitSelected('Piece')"
                    [checked]="unit==='Piece' ? true : false"
                    justify="start">Piece</ion-checkbox>
                </ion-item>
              </ion-col>
            </ion-row>

            <ion-item>
              <ion-input
                  label="Quantity"
                  type="number"
                  placeholder="Enter quantity..."
                  label-placement="floating"
                  [(ngModel)]="quantity"
                  name="quantity"
                  min="1"
                  (input)="confirmQuantity()"
                  required>
              </ion-input>
            </ion-item>
            <br>

            <ion-item>
              <ion-input
                  label="Selling price"
                  type="number"
                  inputmode="numeric"
                  placeholder="Enter price..."
                  label-placement="floating"
                  [(ngModel)]="price"
                  name="selling_price"
                  [min]="selectedItem.min_price"
                  (input)="confirmSellPrice()"
                  required>
              </ion-input>
            </ion-item>
            <br>

          </ion-list>
        </ion-col>
      </ion-row>

      <ion-row class="ion-padding-start ion-padding-end">
        <ion-col class="ion-no-padding">
          <div class="text-center loader" *ngIf="showLoader"></div>
          <ion-button *ngIf="!showLoader"
                      expand="block"
                      type="submit"
                      color="success"
                      [disabled]="!batchForm.valid || price<buying_price || priceError!='' || quantityError != ''"
                      >Save</ion-button>
        </ion-col>
      </ion-row>

    </ion-grid>
  </form>

  </ion-content>
