<ion-content [fullscreen]="true">
  <form #loginForm="ngForm"
          (ngSubmit)="login(loginForm)"
          autocomplete="false">
      <div class="page-wrapper">
        <ion-grid>

          <ion-row>
            <ion-col size-md="3" offset-md="4.5" class="logo">
              <ion-thumbnail>
                <img alt="Pharmaprime" class="logo-img" src="assets/icon/pharma.webp" />
              </ion-thumbnail>
            </ion-col>
          </ion-row>

          <ion-row>
            <ion-col size-md="3" offset-md="4.5">
              <ion-list>
                <ion-item>
                  <ion-input
                      label="Username"
                      type="text"
                      placeholder="Enter username..."
                      label-placement="floating"
                      ngModel
                      name="username"
                      required>
                  </ion-input>
                </ion-item>
                <br>
            
                <ion-item>
                  <ion-input
                      label="Password"
                      type="password"
                      placeholder="Enter password..."
                      label-placement="floating"
                      ngModel
                      name="password"
                      required>
                  </ion-input>
                </ion-item>
              </ion-list>
            </ion-col>
          </ion-row>

          <ion-row>
            <ion-col size-md="3" offset-md="4.5">
              <ion-button expand="block"
                          type="submit"
                          [disabled]="!loginForm.valid"
                          >Login</ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </form>
</ion-content>
